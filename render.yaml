services:
  - type: web
    name: pharmacy-billing-api
    env: node
    buildCommand: cd server && npm install
    startCommand: cd server && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://pharmacybills.vercel.app
      - key: UROPAY_API_KEY
        sync: false
      - key: UROPAY_SECRET
        sync: false
      - key: SERVER_PUBLIC_URL
        sync: false
