services:
  - type: web
    name: pharmacy-billing-api
    env: node
    buildCommand: cd server && npm install
    startCommand: cd server && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://pharmacybills.vercel.app
      - key: UROPAY_API_KEY
        sync: false
      - key: UROPAY_SECRET
        sync: false
      - key: SERVER_PUBLIC_URL
        sync: false
      # LinOTP (self-hosted OTP authority) — when set, it overrides email OTP
      - key: LINOTP_BASE_URL
        sync: false
      - key: LINOTP_REALM
        sync: false
      - key: LINOTP_USERNAME_FIELD
        value: email
      # SMTP / Gmail App Password for live OTP emails
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
