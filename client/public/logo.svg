<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="newLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="35%" stop-color="#6b46c1"/>
      <stop offset="100%" stop-color="#805ad5"/>
    </linearGradient>
    <linearGradient id="newLogoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a9d8f"/>
      <stop offset="35%" stop-color="#f5b73f"/>
      <stop offset="100%" stop-color="#e9c46a"/>
    </linearGradient>
    <linearGradient id="newLogoGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e3a57"/>
      <stop offset="50%" stop-color="#1e4d75"/>
      <stop offset="100%" stop-color="#2d6a9e"/>
    </linearGradient>
    <filter id="newLogoInnerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="1" result="offset-blur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="offset-blur" operator="out"/>
    </filter>
    <filter id="newLogoGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 3D capsule body base -->
  <path d="M4 8 a8 8 0 0 1 16 0 v40 a8 8 0 0 1 -16 0 z" fill="url(#newLogoGrad)"/>
  
  <!-- 3D top highlight -->
  <path d="M4 8 h16 M4 8 v6 L4 14 Z" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <path d="M20 8 h16 M20 8 v6 L20 14 Z" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  
  <!-- 3D side shadow -->
  <path d="M4 8 L4 56 M56 8 L56 56" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
  
  <!-- Rx cross symbol -->
  <path d="M8 14h8 M3 9h18 M3 15h18" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Rx circles -->
  <circle cx="8" cy="18" r="2" fill="#fff"/>
  <circle cx="16" cy="18" r="2" fill="#fff"/>
  <path d="M12 9 v6 M9 12 h6 M15 12 h6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Pharmaceutical accent element -->
  <path d="M22 22 L34 34" stroke="rgba(255,255,255,0.5)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M34 22 L22 34" stroke="rgba(255,255,255,0.5)" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Lower capsule base -->
  <path d="M8 50 a8 8 0 0 1 16 0 z" fill="url(#newLogoGrad2)"/>
  
  <!-- Wordmark accent line -->
  <path d="M12 56 h32" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
</svg>